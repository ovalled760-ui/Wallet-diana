<div class="login-container">
  <h2>Iniciar Sesión 💳</h2>
  <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm" novalidate>
    
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" [(ngModel)]="usuario" name="usuario" required
             placeholder="Ingrese su usuario" maxlength="5" pattern="^[a-zA-Z0-9]*$" #usuarioInput="ngModel">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required
             placeholder="Ingrese su contraseña" maxlength="5" pattern="^[a-zA-Z0-9]*$" #passwordInput="ngModel">
    </div>

    <button type="submit">Ingresar</button>
  </form>
</div>
